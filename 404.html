<!DOCTYPE html>

  <title>Seite nicht gefunden – PadelLiga</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080C">
  <script id="site-base-bootstrap">
    // GitHub Pages behaelt bei einer 404-Antwort die angeforderte URL. Die Basis sorgt dafuer,
    // dass Assets und Startseiten-Link auch von beliebig tiefen, unbekannten Pfaden aus funktionieren.
    (function () {
      var href = '/';
      if (window.location.protocol === 'file:') {
        href = new URL('./', window.location.href).href;
      } else if (/\.github\.io$/i.test(window.location.hostname)) {
        var project = window.location.pathname.split('/').filter(Boolean)[0];
        href = project ? '/' + project + '/' : '/';
      }
      var base = document.createElement('base');
      base.href = href;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="data/favicon.svg?v=2026-10-26-rounded">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="mask-icon" href="data/safari-pinned-tab.svg" color="#d4f53a">
  <link rel="stylesheet" href="branding/og-design.css?v=0570bc4c3f">
  <script>
    // Die gespeicherte Designauswahl greift vor dem ersten Zeichnen.
    (function () {
      try {
        var brandings = ['og-design', 'hanako-leben', 'centre-court', 'envidual', 'hanako', 'headsquare'];
        var name = window.localStorage.getItem('padel-branding-preview');
        var randomMode = window.localStorage.getItem('padel-branding-mode') === 'random';
        var navigation = window.performance && window.performance.getEntriesByType
          ? window.performance.getEntriesByType('navigation')[0]
          : null;
        if (randomMode && (navigation && navigation.type === 'reload' || !brandings.includes(name))) {
          var choices = brandings.filter(function (branding) { return branding !== name; });
          name = choices[Math.floor(Math.random() * choices.length)];
          window.localStorage.setItem('padel-branding-preview', name);
        }
        var link = document.querySelector('link[rel="stylesheet"][href*="branding/"]');
        if (!link || !brandings.includes(name)) return;
        link.dataset.publishedHref = link.getAttribute('href');
        if (!link.getAttribute('href').includes('branding/' + name + '.css')) {
          link.setAttribute('href', link.getAttribute('href').replace(/branding\/.*$/, 'branding/' + name + '.css'));
        }
      } catch (error) { /* Ohne Speicher bleibt das veroeffentlichte Branding. */ }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=2026-11-06-flat-design">
  <link rel="stylesheet" href="404.css?v=2026-11-05">
</head>

  <script>
    (function () {
      var back = document.getElementById('not-found-back');
      if (window.history.length <= 1) back.hidden = true;
      else back.addEventListener('click', function () { window.history.back(); });

      var theme = document.querySelector('meta[name="theme-color"]');
      var updateTheme = function () {
        var background = window.getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
        if (background) theme.setAttribute('content', background);
      };
      window.addEventListener('load', updateTheme, { once: true });
    })();
